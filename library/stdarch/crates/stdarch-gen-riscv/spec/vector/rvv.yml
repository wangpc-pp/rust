    masked: true
    form: v
    args: "{d} vs"
    elems: [i8, i16, i32, i64, u8, u16, u32, u64]
- doc: Vector Single-Width Bit Shift Intrinsics
  intrinsics:
  - name: vsll
    masked: true
    form: vv
    args: "{d} vs2, {d|c=u} vs1"
    suffixes: [vx]
    elems: [i8, i16, i32, i64, u8, u16, u32, u64]
  - name: vsra
    masked: true
    form: vv
    args: "{d} vs2, {d|c=u} vs1"
    suffixes: [vx]
    elems: [i8, i16, i32, i64]
  - name: vsrl
    masked: true
    form: vv
    args: "{d} vs2, {d} vs1"
    suffixes: [vx]
    elems: [u8, u16, u32, u64]
- doc: Vector Narrowing Integer Right Shift Intrinsics
  intrinsics:
  - name: vnsra
    masked: true
    form: wv
    args: "{d|e*2,l+1} vs2, {d|c=u} vs1"
    suffixes: [wx]
    elems: [i8, i16, i32]
    lmuls: [mf8, mf4, mf2, m1, m2, m4]
  - name: vnsrl
    masked: true
    form: wv
    args: "{d|e*2,l+1} vs2, {d} vs1"
    suffixes: [wx]
    elems: [u8, u16, u32]
    lmuls: [mf8, mf4, mf2, m1, m2, m4]
- doc: Vector Integer Narrowing Intrinsics
  intrinsics:
