    masked: true
    form: vv
    args: "{d} vs2, {d} vs1"
    suffixes: [vx]
    elems: [i8, i16, i32, i64, u8, u16, u32, u64]
  - name: vor
    masked: true
    form: vv
    args: "{d} vs2, {d} vs1"
    suffixes: [vx]
    elems: [i8, i16, i32, i64, u8, u16, u32, u64]
