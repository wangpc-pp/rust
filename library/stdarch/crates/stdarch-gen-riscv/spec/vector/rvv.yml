    suffixes: [vx]
    elems: [u8, u16, u32, u64]
  - name: vmsleu
    masked: true
    form: vv
    args: "{d} vs2, {d} vs1"
    ret: "{d.mask}"
    suffixes: [vx]
    elems: [u8, u16, u32, u64]
  - name: vmsgtu
    masked: true
    form: vv
    args: "{d} vs2, {d} vs1"
    ret: "{d.mask}"
    suffixes: [vx]
    elems: [u8, u16, u32, u64]
  - name: vmsgeu
    masked: true
    form: vv
    args: "{d} vs2, {d} vs1"
    ret: "{d.mask}"
    suffixes: [vx]
