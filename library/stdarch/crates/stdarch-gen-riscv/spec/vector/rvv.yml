# RISC-V Vector (RVV 1.0) intrinsic specification.
#
# This file is the source of truth for the generated RVV bindings; edit it by
# hand and regenerate with:
#   cargo run -p stdarch-gen-riscv -- crates/stdarch-gen-riscv/spec/vector/rvv.yml
#
# The file is a list of documentation `sections`. Each section has a one-line
# `doc:` heading and an `intrinsics:` list of the families under it, so the
# heading is written once per section (it is metadata only and does not affect
# the generated bindings).
#
# Each family is one operation. It uses either:
#  * a structured template (`form` + `args` + type sweep fields), or
#  * a built-in `kind` generator for pseudo families and conversion matrices
#    (vsetvl, vmv, vfcvt, vreinterpret, vget/vset/vcreate, ...).
#
# For structured templates, the RVV name
# `__riscv_<name>_<form>_<RETURN_TYPE>` is rebuilt from the family:
#   form    operand-form marker (v, vv, vx, vf, wv, vvm, ...)
#   args    parameter list without trailing `size_t vl` (auto-appended)
#   ret     return type; defaults to `{d}`. The name's RETURN_TYPE suffix is
#           `{d.suf}`, `{d.suf}_{d.msuf}` for mask returns, or `namesuf` when set.
#
# Type sweeps are cartesian products:
#   elems   element types as `<class><sew>` (i8, u16, f32, bf16)
#   lmuls   LMUL candidates; omitted means all legal LMULs for each element width
#   nf      tuple size (default 1), restricted by `LMUL * nf <= 8`
#   masks   mask-only families sweep `b1`..`b64`; `{m}` -> `vbool<N>_t`,
#           `{m.suf}` -> `b<N>`.
#
# Placeholders in args/namesuf:
#   {d}      D itself        {d.suf}   D suffix
#   {d.s}    scalar elem     {d.mask}  companion vboolK_t
#   {d.msuf} mask suffix     {m} / {m.suf} for mask sweeps
#   {d|OPS}  transformed D; OPS include c=, e*/e/, l+/l-/l=, nf=, ei<K>
#
# `masked: true` synthesizes `_m`, `rounding: true` synthesizes `_rm`, and
# `suffixes: [vx, wv, ...]` derives extra operand forms from the primary form.
# Parameters named `frm` or `vxrm` remain `size_t` (iXLEN) in this C-like spec,
# but are emitted as range-checked Rust `const` generics. Legacy const-generic
# attributes preserve their original argument positions at call sites.
# The lowering (`llvm.riscv.*` names + operand order) comes from the checked-in
# `rvv_lowering.tsv` oracle, extracted from clang's autogenerated RVV tests.

sections:
- doc: Vector Unit-Stride Load Intrinsics
  intrinsics:
  - name: vle{sew}
    masked: true
    form: v
    args: "const {d.s} * rs1"
    sew: [8, 16, 32, 64]
- doc: Vector Unit-Stride Store Intrinsics
  intrinsics:
  - name: vse{sew}
    masked: true
    form: v
    args: "{d.s} * rs1, {d} vs3"
    ret: "void"
    sew: [8, 16, 32, 64]
- doc: Vector Mask Load/Store Intrinsics
  intrinsics:
  - name: vlm
    masks: [b1, b2, b4, b8, b16, b32, b64]
    form: v
    args: "const uint8_t * rs1"
    ret: "{m}"
  - name: vsm
    masks: [b1, b2, b4, b8, b16, b32, b64]
    form: v
    args: "uint8_t * rs1, {m} vs3"
    ret: "void"
- doc: Vector Strided Load Intrinsics
  intrinsics:
  - name: vlse{sew}
    masked: true
    form: v
    args: "const {d.s} * rs1, ptrdiff_t rs2"
    sew: [8, 16, 32, 64]
- doc: Vector Strided Store Intrinsics
  intrinsics:
  - name: vsse{sew}
    masked: true
    form: v
    args: "{d.s} * rs1, ptrdiff_t rs2, {d} vs3"
    ret: "void"
    sew: [8, 16, 32, 64]
- doc: Vector Indexed Load Intrinsics
  intrinsics:
  - name: vloxei{sew}
    masked: true
    form: v
    args: "const {d.s} * rs1, {d|ei{sew}} rs2"
    elems: [f16, bf16, f32, f64, i8, i16, i32, i64, u8, u16, u32, u64]
    sew: [8, 16, 32, 64]
  - name: vluxei{sew}
    masked: true
    form: v
    args: "const {d.s} * rs1, {d|ei{sew}} rs2"
    elems: [f16, bf16, f32, f64, i8, i16, i32, i64, u8, u16, u32, u64]
    sew: [8, 16, 32, 64]
- doc: Vector Indexed Store Intrinsics
  intrinsics:
  - name: vsoxei{sew}
    masked: true
    form: v
    args: "{d.s} * rs1, {d|ei{sew}} rs2, {d} vs3"
    ret: "void"
    elems: [f16, bf16, f32, f64, i8, i16, i32, i64, u8, u16, u32, u64]
    sew: [8, 16, 32, 64]
  - name: vsuxei{sew}
    masked: true
    form: v
    args: "{d.s} * rs1, {d|ei{sew}} rs2, {d} vs3"
    ret: "void"
    elems: [f16, bf16, f32, f64, i8, i16, i32, i64, u8, u16, u32, u64]
    sew: [8, 16, 32, 64]
- doc: Unit-stride Fault-Only-First Loads Intrinsics
  intrinsics:
  - name: vle{sew}ff
    masked: true
    form: v
    args: "const {d.s} * rs1, size_t * new_vl"
    sew: [8, 16, 32, 64]
- doc: Vector Unit-Stride Segment Load Intrinsics
  intrinsics:
  - name: vlseg{nf}e{sew}
    masked: true
    form: v
    args: "const {d.s} * rs1"
    sew: [16, 32, 64]
    nf: [2, 3, 4, 5, 6, 7, 8]
  - name: vlseg{nf}e{sew}ff
    masked: true
    form: v
    args: "const {d.s} * rs1, size_t * new_vl"
    sew: [16, 32, 64]
    nf: [2, 3, 4, 5, 6, 7, 8]
  - name: vlseg{nf}e8
    masked: true
    form: v
    args: "const {d.s} * rs1"
    elems: [i8, u8]
    nf: [2, 3, 4, 5, 6, 7, 8]
  - name: vlseg{nf}e8ff
    masked: true
    form: v
    args: "const {d.s} * rs1, size_t * new_vl"
    elems: [i8, u8]
    nf: [2, 3, 4, 5, 6, 7, 8]
- doc: Vector Unit-Stride Segment Store Intrinsics
  intrinsics:
  - name: vsseg{nf}e16
    masked: true
    form: v
    args: "{d.s} * rs1, {d} vs3"
    ret: "void"
    elems: [f16, i16, u16, bf16]
    nf: [2, 3, 4, 5, 6, 7, 8]
  - name: vsseg{nf}e32
    masked: true
    form: v
    args: "{d.s} * rs1, {d} vs3"
    ret: "void"
    elems: [f32, i32, u32]
    nf: [2, 3, 4, 5, 6, 7, 8]
  - name: vsseg{nf}e64
    masked: true
    form: v
    args: "{d.s} * rs1, {d} vs3"
    ret: "void"
    elems: [f64, i64, u64]
    nf: [2, 3, 4, 5, 6, 7, 8]
  - name: vsseg{nf}e8
    masked: true
    form: v
    args: "{d.s} * rs1, {d} vs3"
    ret: "void"
    elems: [i8, u8]
    nf: [2, 3, 4, 5, 6, 7, 8]
- doc: Vector Strided Segment Load Intrinsics
  intrinsics:
  - name: vlsseg{nf}e16
    masked: true
    form: v
    args: "const {d.s} * rs1, ptrdiff_t rs2"
    elems: [f16, i16, u16, bf16]
    nf: [2, 3, 4, 5, 6, 7, 8]
  - name: vlsseg{nf}e32
    masked: true
    form: v
    args: "const {d.s} * rs1, ptrdiff_t rs2"
    elems: [f32, i32, u32]
    nf: [2, 3, 4, 5, 6, 7, 8]
  - name: vlsseg{nf}e64
    masked: true
    form: v
    args: "const {d.s} * rs1, ptrdiff_t rs2"
    elems: [f64, i64, u64]
    nf: [2, 3, 4, 5, 6, 7, 8]
  - name: vlsseg{nf}e8
    masked: true
    form: v
    args: "const {d.s} * rs1, ptrdiff_t rs2"
    elems: [i8, u8]
    nf: [2, 3, 4, 5, 6, 7, 8]
- doc: Vector Strided Segment Store Intrinsics
  intrinsics:
  - name: vssseg{nf}e16
    masked: true
    form: v
    args: "{d.s} * rs1, ptrdiff_t rs2, {d} vs3"
    ret: "void"
    elems: [f16, i16, u16, bf16]
    nf: [2, 3, 4, 5, 6, 7, 8]
  - name: vssseg{nf}e32
    masked: true
    form: v
    args: "{d.s} * rs1, ptrdiff_t rs2, {d} vs3"
    ret: "void"
    elems: [f32, i32, u32]
    nf: [2, 3, 4, 5, 6, 7, 8]
  - name: vssseg{nf}e64
    masked: true
    form: v
    args: "{d.s} * rs1, ptrdiff_t rs2, {d} vs3"
    ret: "void"
    elems: [f64, i64, u64]
    nf: [2, 3, 4, 5, 6, 7, 8]
  - name: vssseg{nf}e8
    masked: true
    form: v
    args: "{d.s} * rs1, ptrdiff_t rs2, {d} vs3"
    ret: "void"
    elems: [i8, u8]
    nf: [2, 3, 4, 5, 6, 7, 8]
- doc: Vector Indexed Segment Load Intrinsics
  intrinsics:
  - name: vloxseg{nf}ei{sew}
    masked: true
    form: v
    args: "const {d.s} * rs1, {d|ei{sew}} rs2"
    sew: [8, 16, 32, 64]
    nf: [2, 3, 4, 5, 6, 7, 8]
    elems: [f16, bf16, f32, f64, i8, i16, i32, i64, u8, u16, u32, u64]
  - name: vluxseg{nf}ei{sew}
    masked: true
    form: v
    args: "const {d.s} * rs1, {d|ei{sew}} rs2"
    sew: [8, 16, 32, 64]
    nf: [2, 3, 4, 5, 6, 7, 8]
    elems: [f16, bf16, f32, f64, i8, i16, i32, i64, u8, u16, u32, u64]
- doc: Vector Indexed Segment Store Intrinsics
  intrinsics:
  - name: vsoxseg{nf}ei{sew}
    masked: true
    form: v
    args: "{d.s} * rs1, {d|ei{sew}} rs2, {d} vs3"
    ret: "void"
    sew: [8, 16, 32, 64]
    nf: [2, 3, 4, 5, 6, 7, 8]
    elems: [f16, bf16, f32, f64, i8, i16, i32, i64, u8, u16, u32, u64]
  - name: vsuxseg{nf}ei{sew}
    masked: true
    form: v
    args: "{d.s} * rs1, {d|ei{sew}} rs2, {d} vs3"
    ret: "void"
    sew: [8, 16, 32, 64]
    nf: [2, 3, 4, 5, 6, 7, 8]
    elems: [f16, bf16, f32, f64, i8, i16, i32, i64, u8, u16, u32, u64]
- doc: Vector Single-Width Integer Add and Subtract Intrinsics
  intrinsics:
  - name: vadd
    masked: true
    form: vv
    args: "{d} vs2, {d} vs1"
    suffixes: [vx]
    elems: [i8, i16, i32, i64, u8, u16, u32, u64]
  - name: vsub
    masked: true
    form: vv
    args: "{d} vs2, {d} vs1"
    suffixes: [vx]
    elems: [i8, i16, i32, i64, u8, u16, u32, u64]
  - name: vrsub
    masked: true
    form: vx
    args: "{d} vs2, {d.s} rs1"
    elems: [i8, i16, i32, i64, u8, u16, u32, u64]
- doc: Vector Widening Integer Add/Subtract Intrinsics
  intrinsics:
  - name: vwadd
    masked: true
    form: vv
    args: "{d|e/2,l-1} vs2, {d|e/2,l-1} vs1"
    suffixes: [vx, wv, wx]
    elems: [i16, i32, i64]
  - name: vwsub
    masked: true
    form: vv
    args: "{d|e/2,l-1} vs2, {d|e/2,l-1} vs1"
    suffixes: [vx, wv, wx]
    elems: [i16, i32, i64]
  - name: vwaddu
    masked: true
    form: vv
    args: "{d|e/2,l-1} vs2, {d|e/2,l-1} vs1"
    suffixes: [vx, wv, wx]
    elems: [u16, u32, u64]
  - name: vwsubu
    masked: true
    form: vv
    args: "{d|e/2,l-1} vs2, {d|e/2,l-1} vs1"
    suffixes: [vx, wv, wx]
    elems: [u16, u32, u64]
- doc: Vector Integer Widening Intrinsics
  intrinsics:
  - name: vwcvt
    masked: true
    form: x_x_v
    args: "{d|e/2,l-1} vs2"
    elems: [i16, i32, i64]
  - name: vwcvtu
    masked: true
    form: x_x_v
    args: "{d|e/2,l-1} vs2"
    elems: [u16, u32, u64]
- doc: Vector Integer Extension Intrinsics
  intrinsics:
  - name: vsext
    masked: true
    form: vf2
    args: "{d|e/2,l-1} vs2"
    elems: [i16, i32, i64]
  - name: vsext
    masked: true
    form: vf4
    args: "{d|e/4,l-2} vs2"
    elems: [i32, i64]
  - name: vsext
    masked: true
    form: vf8
    args: "{d|e/8,l-3} vs2"
    elems: [i64]
  - name: vzext
    masked: true
    form: vf2
    args: "{d|e/2,l-1} vs2"
    elems: [u16, u32, u64]
  - name: vzext
    masked: true
    form: vf4
    args: "{d|e/4,l-2} vs2"
    elems: [u32, u64]
  - name: vzext
    masked: true
    form: vf8
    args: "{d|e/8,l-3} vs2"
    elems: [u64]
- doc: Vector Integer Neg Intrinsics
  intrinsics:
  - name: vneg
    masked: true
    form: v
    args: "{d} vs2"
    elems: [i8, i16, i32, i64]
- doc: Vector Integer Add-with-Carry / Subtract-with-Borrow Intrinsics
  intrinsics:
  - name: vadc
    form: vvm
    args: "{d} vs2, {d} vs1, {d.mask} v0"
    suffixes: [vxm]
    elems: [i8, i16, i32, i64, u8, u16, u32, u64]
  - name: vsbc
    form: vvm
    args: "{d} vs2, {d} vs1, {d.mask} v0"
    suffixes: [vxm]
    elems: [i8, i16, i32, i64, u8, u16, u32, u64]
  - name: vmadc
    form: vvm
    args: "{d} vs2, {d} vs1, {d.mask} v0"
    ret: "{d.mask}"
    suffixes: [vxm, vv, vx]
    elems: [i8, i16, i32, i64, u8, u16, u32, u64]
  - name: vmsbc
    form: vvm
    args: "{d} vs2, {d} vs1, {d.mask} v0"
    ret: "{d.mask}"
    suffixes: [vxm, vv, vx]
    elems: [i8, i16, i32, i64, u8, u16, u32, u64]
- doc: Vector Bitwise Binary Logical Intrinsics
  intrinsics:
