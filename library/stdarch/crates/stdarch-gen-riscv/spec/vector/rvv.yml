    masked: true
    form: x_x_w
    args: "{d|e*2,l+1} vs2"
    elems: [i8, u8, i16, u16, i32, u32]
    lmuls: [mf8, mf4, mf2, m1, m2, m4]
- doc: Vector Integer Compare Intrinsics
  intrinsics:
